<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2016-2025 台灣、日本、韓國入境旅客人次統計圖表</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Highcharts core & export modules with reliable CDN & defer handling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/highcharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/modules/series-label.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/modules/exporting.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/modules/export-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/modules/accessibility.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col p-4 md:p-8">

  <!-- Header Section -->
  <header class="max-w-6xl w-full mx-auto mb-6 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-semibold rounded-full mb-3">
      <span>官方統計數據視覺化</span> • <span>2016 – 2025</span>
    </div>
    <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">
      台灣、日本、韓國 歷年入境旅客人次趨勢圖
    </h1>
    <p class="text-slate-500 text-sm mt-1">
      資料來源：台灣交通部觀光署 (MOTC)・日本政府觀光局 (JNTO)・韓國觀光公社 (KTO)
    </p>
  </header>

  <!-- Interactive Controls Bar -->
  <section class="max-w-6xl w-full mx-auto mb-4 flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">視圖控制：</span>
      <button id="btn-toggle-labels" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
        切換數值標籤
      </button>
      <button id="btn-log-scale" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
        對數 / 線性刻度
      </button>
    </div>
    <div class="text-xs text-slate-400">
      * 支援縮放、右上方功能表匯出圖片 (PNG/PDF/SVG)
    </div>
  </section>

  <!-- Chart Container Card -->
  <main class="max-w-6xl w-full mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 mb-8 flex-1">
    <div id="chart-container" class="w-full h-[520px]"></div>
    <div id="loading-state" class="text-center py-20 text-slate-400 text-sm hidden">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-2"></div>
      <p>正在載入圖表模組...</p>
    </div>
  </main>

  <footer class="max-w-6xl w-full mx-auto text-center text-xs text-slate-400 pb-6">
    國際觀光客入境人次數據分析
  </footer>

  <!-- Highcharts Initialization Logic with Safe Dependency Fallback -->
  <script>
    // 動態載入腳本工具函式（附備用 CDN 機制）
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load ${url}`));
        document.head.appendChild(script);
      });
    }

    async function ensureHighchartsLoaded() {
      if (typeof window.Highcharts !== 'undefined') {
        return;
      }
      
      const loadingState = document.getElementById('loading-state');
      if (loadingState) loadingState.classList.remove('hidden');

      // 備援 CDN 清單 (cdnjs -> unpkg -> code.highcharts.com)
      const cdnSets = [
        'https://unpkg.com/highcharts@11.4.0/highcharts.js',
        'https://code.highcharts.com/highcharts.js'
      ];

      for (const cdn of cdnSets) {
        try {
          await loadScript(cdn);
          if (typeof window.Highcharts !== 'undefined') {
            break;
          }
        } catch (e) {
          console.warn('CDN 加載失敗，嘗試下一個來源：', cdn);
        }
      }

      if (loadingState) loadingState.classList.add('hidden');

      if (typeof window.Highcharts === 'undefined') {
        throw new Error('無法載入 Highcharts 資源，請檢查網路連接或允許 CDN 腳本執行。');
      }
    }

    async function initChart() {
      try {
        await ensureHighchartsLoaded();
      } catch (err) {
        document.getElementById('chart-container').innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-slate-500">
            <p class="text-red-500 font-semibold mb-2">圖表載入失敗</p>
            <p class="text-sm">${err.message}</p>
            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-lg hover:bg-indigo-700">
              重新載入頁面
            </button>
          </div>
        `;
        return;
      }

      // 2016 - 2025 官方入境國際旅客人次數據
      const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025];
      
      const taiwanData = [
        10690279, 10739601, 11066742, 11864105, 1377861, 
        140479, 895962, 6486965, 7858000, 8574547
      ];
      
      const japanData = [
        24039700, 28691073, 31191856, 31882049, 4115828, 
        245862, 3832110, 25066350, 36870148, 42683600
      ];
      
      const koreaData = [
        17241823, 13335758, 15346879, 17502756, 2519118, 
        967003, 3198017, 11031665, 16369634, 18937000
      ];

      let dataLabelsVisible = false;
      let isLogScale = false;

      // 初始化 Highcharts 折線圖
      const chart = Highcharts.chart('chart-container', {
        chart: {
          type: 'line',
          zooming: {
            type: 'x'
          },
          style: {
            fontFamily: 'inherit'
          },
          backgroundColor: 'transparent'
        },
        title: {
          text: null
        },
        credits: {
          enabled: false
        },
        xAxis: {
          categories: years.map(String),
          crosshair: {
            width: 1,
            color: '#cbd5e1',
            dashStyle: 'Dash'
          },
          labels: {
            style: {
              color: '#64748b',
              fontSize: '12px',
              fontWeight: '500'
            }
          },
          lineColor: '#e2e8f0',
          tickColor: '#e2e8f0'
        },
        yAxis: {
          type: 'linear',
          title: {
            text: '入境人次 (Visitor Arrivals)',
            style: {
              color: '#475569',
              fontSize: '13px',
              fontWeight: '600'
            }
          },
          labels: {
            formatter: function () {
              if (this.value >= 10000000) {
                return (this.value / 10000000).toFixed(1) + ' 千萬';
              } else if (this.value >= 10000) {
                return (this.value / 10000) + ' 萬';
              }
              return Highcharts.numberFormat(this.value, 0, '.', ',');
            },
            style: {
              color: '#64748b',
              fontSize: '12px'
            }
          },
          gridLineColor: '#f1f5f9'
        },
        tooltip: {
          shared: true,
          useHTML: true,
          backgroundColor: 'rgba(255, 255, 255, 0.96)',
          borderColor: '#e2e8f0',
          borderRadius: 10,
          shadow: {
            color: 'rgba(15, 23, 42, 0.08)',
            offsetX: 0,
            offsetY: 4,
            opacity: 1,
            width: 8
          },
          headerFormat: '<div class="text-xs font-semibold text-slate-500 mb-1.5 pb-1 border-b border-slate-100">{point.key} 年</div>',
          pointFormatter: function () {
            const formattedVal = Highcharts.numberFormat(this.y, 0, '.', ',');
            return `
              <div class="flex items-center justify-between gap-4 py-0.5 text-xs">
                <span class="flex items-center gap-1.5 font-medium" style="color:${this.color}">
                  <span class="w-2 h-2 rounded-full inline-block" style="background:${this.color}"></span>
                  ${this.series.name}:
                </span>
                <span class="font-bold text-slate-800 text-right">${formattedVal} 人次</span>
              </div>
            `;
          }
        },
        plotOptions: {
          line: {
            lineWidth: 3,
            marker: {
              radius: 5,
              symbol: 'circle',
              states: {
                hover: {
                  radius: 7,
                  lineWidth: 2
                }
              }
            },
            dataLabels: {
              enabled: false,
              formatter: function () {
                if (this.y >= 10000) {
                  return (this.y / 10000).toFixed(0) + '萬';
                }
                return this.y;
              },
              style: {
                fontSize: '10px',
                fontWeight: '600',
                textOutline: 'none'
              }
            }
          }
        },
        colors: [
          '#0ea5e9', // 台灣: 蔚藍色
          '#ef4444', // 日本: 緋紅色
          '#8b5cf6'  // 韓國: 紫羅蘭色
        ],
        series: [
          {
            name: '台灣 (Taiwan)',
            data: taiwanData
          },
          {
            name: '日本 (Japan)',
            data: japanData
          },
          {
            name: '韓國 (South Korea)',
            data: koreaData
          }
        ],
        responsive: {
          rules: [{
            condition: {
              maxWidth: 600
            },
            chartOptions: {
              legend: {
                layout: 'horizontal',
                align: 'center',
                verticalAlign: 'bottom'
              },
              yAxis: {
                labels: {
                  align: 'left',
                  x: 0,
                  y: -5
                },
                title: {
                  text: null
                }
              }
            }
          }]
        },
        exporting: {
          enabled: true,
          buttons: {
            contextButton: {
              menuItems: [
                'downloadPNG',
                'downloadJPEG',
                'downloadPDF',
                'downloadSVG',
                'separator',
                'downloadCSV',
                'downloadXLS'
              ]
            }
          }
        }
      });

      // 按鈕：切換數值標籤
      const toggleLabelsBtn = document.getElementById('btn-toggle-labels');
      toggleLabelsBtn.addEventListener('click', () => {
        dataLabelsVisible = !dataLabelsVisible;
        chart.series.forEach(series => {
          series.update({
            dataLabels: {
              enabled: dataLabelsVisible
            }
          }, false);
        });
        chart.redraw();
        toggleLabelsBtn.classList.toggle('bg-indigo-600', dataLabelsVisible);
        toggleLabelsBtn.classList.toggle('text-white', dataLabelsVisible);
      });

      // 按鈕：切換線性 / 對數刻度
      const toggleLogBtn = document.getElementById('btn-log-scale');
      toggleLogBtn.addEventListener('click', () => {
        isLogScale = !isLogScale;
        chart.yAxis[0].update({
          type: isLogScale ? 'logarithmic' : 'linear'
        });
        toggleLogBtn.classList.toggle('bg-indigo-600', isLogScale);
        toggleLogBtn.classList.toggle('text-white', isLogScale);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initChart);
    } else {
      initChart();
    }
  </script>
</body>
</html>
